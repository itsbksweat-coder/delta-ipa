name: Build TCL Roku Remote IPA

on:
  push:
    branches:
      - roku-remote-build
    paths-ignore:
      - roku-remote/TCL-Roku-Remote-unsigned.ipa.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: roku-remote-build

      - name: Build ARM64 iPhone app
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          APP="$GITHUB_WORKSPACE/build/Payload/TCLRokuRemote.app"
          mkdir -p "$APP"
          cp roku-remote/Info.plist "$APP/Info.plist"

          xcrun swiftc             -swift-version 5             -parse-as-library             -sdk "$SDK"             -target arm64-apple-ios16.0             -framework SwiftUI             -framework UIKit             -framework Foundation             roku-remote/main.swift             -o "$APP/TCLRokuRemote"

          chmod +x "$APP/TCLRokuRemote"
          /usr/bin/plutil -lint "$APP/Info.plist"

          cd "$GITHUB_WORKSPACE/build"
          /usr/bin/zip -qry TCL-Roku-Remote-unsigned.ipa Payload
          /bin/ls -lh TCL-Roku-Remote-unsigned.ipa
          /usr/bin/base64 < TCL-Roku-Remote-unsigned.ipa > "$GITHUB_WORKSPACE/roku-remote/TCL-Roku-Remote-unsigned.ipa.b64"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TCL-Roku-Remote-unsigned
          path: build/TCL-Roku-Remote-unsigned.ipa
          if-no-files-found: error

      - name: Save IPA back to build branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roku-remote/TCL-Roku-Remote-unsigned.ipa.b64
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add built TCL Roku Remote IPA"
          git push origin HEAD:roku-remote-build
