name: Build ODY unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ODY-iOS-project.zip.b64'
      - '.github/workflows/build-ody-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Decode ODY project
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data = Path('ODY-iOS-project.zip.b64').read_text().strip()
          Path('ODY-iOS-project.zip').write_bytes(base64.b64decode(data))
          PY
          rm -rf ody-src
          mkdir -p ody-src
          unzip -q ODY-iOS-project.zip -d ody-src

      - name: Build ODY app without signing
        run: |
          set -e
          xcodebuild \
            -project ody-src/ODY-iOS/ODY.xcodeproj \
            -scheme ODY \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ody-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

      - name: Package IPA
        run: |
          set -e
          rm -rf Payload ODY-unsigned.ipa
          mkdir -p Payload
          cp -R ody-build/Build/Products/Release-iphoneos/ODY.app Payload/
          zip -qr ODY-unsigned.ipa Payload

      - name: Upload ODY IPA
        uses: actions/upload-artifact@v4
        with:
          name: ODY-unsigned-IPA
          path: ODY-unsigned.ipa
